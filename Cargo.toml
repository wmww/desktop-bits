[workspace]
resolver = "2"
members = [
    "permission-prompt-ui",
    "permission-prompt",
    "sudo-prompt",
    "sudo-shim",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
# The `monitor` signal we rely on for per-output lock surfaces is gtk4-layer-shell >= 1.2.0.
gtk4-session-lock = { version = "0.4", features = ["v1_2"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
unicode-general-category = "1"
